[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "openai-responses-proxy"
dynamic = ["version"]
description = "Local compatibility proxy between OpenAI Responses clients, such as Codex, and third-party providers: on qualified routes it keeps tool calls and collaboration messages intact and adapts streaming and replay, leaving conversation state untouched."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "certifi==2026.10.23",
  "cyclopts==5.4.0",
  "filelock==4.2.10",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.scripts]
openai-responses-proxy = "openai_responses_proxy.cli.application:main"

[dependency-groups]
quality = [
  "coverage==7.17.2",
  "deptry==0.25.1",
  "hatchling==1.33.0",
  "nox==2026.10.20",
  "pyflakes==4.1.0",
  "pyperf==2.11.0",
  "pytest==9.2.0",
  "pytest-mock==3.17.0",
  "pytest-reportlog==1.0.0",
  "pytest-subtests==0.15.0",
  "pyyaml==6.0.3",
  "ruff==0.17.4",
  "ty==0.0.100",
  "vulture==2.16",
]
release = ["pyinstaller==6.22.3"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["/src/openai_responses_proxy", "/VERSION", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_responses_proxy"]
