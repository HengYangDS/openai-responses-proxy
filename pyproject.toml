[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "openai-responses-proxy"
dynamic = ["version"]
description = "Local compatibility proxy for third-party OpenAI Responses APIs, preserving tool calls and readable collaboration on qualified routes, with streaming adaptation, portable replay, bounded recovery and native service lifecycle."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "certifi==2026.7.22",
  "cyclopts==5.0.0",
  "filelock==4.0.3",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.scripts]
openai-responses-proxy = "openai_responses_proxy.cli.application:main"

[tool.openai-responses-proxy]
distribution = "native-executable"
linux-release-image = "python:3.14.7-bookworm@sha256:ecac9e212daacda8a702eae372fceebc0ee36f5805abe087880367e8d061fa5b"

[dependency-groups]
quality = [
  "coverage==7.16.1",
  "deptry==0.25.1",
  "hatchling==1.32.4",
  "nox==2026.8.17",
  "pyperf==2.10.0",
  "pytest==9.1.1",
  "pytest-mock==3.15.1",
  "pytest-reportlog==1.0.0",
  "pytest-subtests==0.15.0",
  "pyyaml==6.0.3",
  "ruff==0.16.8",
  "ty==0.0.83",
  "vulture==2.16",
]
release = ["pyinstaller==6.22.3"]

[tool.uv]
required-version = "==0.12.18"
link-mode = "copy"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["/src/openai_responses_proxy", "/VERSION", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_responses_proxy"]
