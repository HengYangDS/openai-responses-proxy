name: Verify
"on":
  workflow_call:
    secrets:
      CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST:
        required: true
      CODEX_RESPONSES_PROXY_RELEASE_ASSET_SIGNING_KEY:
        required: false
  push:
    tags:
      - v*
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published vMAJOR.MINOR.PATCH tag to verify
        required: true
        type: string
permissions:
  contents: read
env:
  OPENAI_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-matrix:
    name: Resolve supported Python versions
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.value }}
      floor: ${{ steps.versions.outputs.floor }}
      latest: ${{ steps.versions.outputs.latest }}
      release: ${{ steps.versions.outputs.release }}
      linux-release-image: ${{ steps.versions.outputs.linux-release-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Install the locked matrix tool environment
        run: uv sync --locked --all-groups
      - name: Read the repository Python matrix
        id: versions
        run: uv run --locked --no-sync python -m tools.quality.python_matrix
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  source-and-governance:
    name: Source and governance
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .config/mise/python-release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - name: Install and audit locked Node repository tools
        run: npm ci --ignore-scripts
      - name: Audit locked Node repository tool signatures
        run: npm audit signatures
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Confirm source identity and repository governance
        run: uv run --locked --no-sync python -m tools.quality.governance --online-links
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  commit-admission:
    name: Native commit admission
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ETHOS_COMMIT_ALLOWED_SIGNERS: ${{ vars.ETHOS_COMMIT_ALLOWED_SIGNERS }}
      OPENAI_RESPONSES_PROXY_COMMIT_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/build/runtime/ethos-source/src
    steps:
      - name: Require external public commit trust
        run: test "${ETHOS_COMMIT_ALLOWED_SIGNERS:-}" != "${ETHOS_COMMIT_ALLOWED_SIGNERS+${ETHOS_COMMIT_ALLOWED_SIGNERS%%[![:space:]]*}}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Refresh native ETHOS Linux prerequisite metadata
        run: sudo apt-get update -qq
      - name: Install native ETHOS Linux prerequisites
        run: sudo apt-get install -qq -y --no-install-recommends curl ca-certificates libatomic1
      - name: Select the exact native ETHOS source
        run: git clone --filter=blob:none --no-checkout https://github.com/HengYangDS/ethos.git build/runtime/ethos-source
      - name: Select the exact native ETHOS source
        run: git -C build/runtime/ethos-source checkout --detach 92253d2a82560173f5c645cca419e5f302a11718
      - name: Select the exact native ETHOS source
        run: git -C build/runtime/ethos-source diff --exit-code ed29cbe27e0412ae82f4fe90dd18622cb69d62df HEAD --
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source sync --locked --no-install-project --group dev
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source run --locked --no-sync python -B -m tools.ci.toolchain.native --root . --mise node vale
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source run --locked --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source sync --locked --group dev --no-editable --no-build-isolation-package ethos
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source run --locked --no-sync python -B -I -m ethos.cli --version
      - name: Prepare locked native ETHOS supply and external commit trust
        run: uv --directory build/runtime/ethos-source run --locked --no-sync python -B -c 'import os; from pathlib import Path; from tools.ci.toolchain.environment import bind_commit_trust_material; bind_commit_trust_material(Path(os.environ["OPENAI_RESPONSES_PROXY_COMMIT_ROOT"]), os.environ["ETHOS_COMMIT_ALLOWED_SIGNERS"])'
      - name: Admit the exact introduced commit range
        env:
          OPENAI_RESPONSES_PROXY_COMMIT_BASE: ${{ github.ref_type == 'tag' && github.sha || github.event.pull_request.base.sha || github.event.before }}
          OPENAI_RESPONSES_PROXY_COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENAI_RESPONSES_PROXY_COMMIT_TARGET: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          OPENAI_RESPONSES_PROXY_COMMIT_PEER: github
        run: build/runtime/ethos-source/.venv/bin/python -B -I -m ethos.cli hook commit-range --target-ref "$OPENAI_RESPONSES_PROXY_COMMIT_TARGET" --proposed-head "$OPENAI_RESPONSES_PROXY_COMMIT_HEAD" --remote-head "$OPENAI_RESPONSES_PROXY_COMMIT_BASE" --remote "$OPENAI_RESPONSES_PROXY_COMMIT_PEER" --trusted-baseline refs/remotes/origin/dev --root . --json
  python:
    name: Python ${{ matrix.python-version }}
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: python-matrix
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Compile and test
        run: uv run --locked --group quality nox -s "tests-${{ matrix.python-version }}"
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  python-windows:
    name: Python ${{ matrix.python-version }} (Windows)
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: python-matrix
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Compile and test
        run: uv run --locked --group quality nox -s "tests-${{ matrix.python-version }}"
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  accepted-source:
    name: Accepted source
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .config/mise/python-release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Confirm accepted source and metadata
        run: uv sync --locked --all-groups
      - name: Verify accepted release metadata
        run: uv run --locked --no-sync python -m tools.release.metadata
      - name: Verify accepted repository structure
        run: uv run --locked --no-sync python -m tools.quality.repository
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  promotion:
    name: Promote dev to main
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .config/mise/python-release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Prove exact dev-to-main promotion
        run: git fetch origin main dev --tags --force --prune --prune-tags
      - name: Verify promotion ancestry
        run: git merge-base --is-ancestor origin/main "${{ github.event.pull_request.head.sha }}"
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Verify promoted release metadata
        run: uv run --locked --no-sync python -m tools.release.metadata
      - name: Verify promoted repository structure
        run: uv run --locked --no-sync python -m tools.quality.repository
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  tag-metadata:
    name: Tag metadata and governance
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: python-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.latest }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - name: Install and audit locked Node repository tools
        run: npm ci --ignore-scripts
      - name: Audit locked Node repository tool signatures
        run: npm audit signatures
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Verify exact release metadata
        run: uv run --locked --no-sync python -m tools.release.metadata --tag "$GITHUB_REF_NAME"
      - name: Verify release repository structure
        run: uv run --locked --no-sync python -m tools.quality.repository
      - name: Verify repository governance
        run: uv run --locked --no-sync python -m pytest -q --rootdir . -c .config/checks/pytest/pytest.toml tests/quality/test_policy.py tests/quality/repository tests/quality/orchestration/test_governance.py tests/forge/workflows tests/release/publication
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  python-quality:
    name: Python quality
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: python-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.floor }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      - name: Verify lint, format, types, structure, docstrings, and product branch coverage
        run: uv run --locked --group quality nox -s quality
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  performance:
    name: Performance
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: python-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.release }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Measure deterministic product overhead
        run: uv run --locked --group quality nox -s performance -- "$RUNNER_TEMP/performance"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance
          path: ${{ runner.temp }}/performance/*.json
          if-no-files-found: error
          retention-days: 7
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  native-assets:
    name: Native asset (${{ matrix.platform }})
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: python-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.release }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Install the locked release tool environment
        run: uv sync --locked --group quality
      - name: Build and accept the native release asset
        run: uv run --locked --no-sync nox -s release -- "${{ runner.temp }}/native-assets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-assets
          if-no-files-found: error
          retention-days: 7
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  native-linux:
    name: Native asset (linux-x86_64)
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: python-matrix
    runs-on: ubuntu-24.04
    container: ${{ needs.python-matrix.outputs.linux-release-image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Materialize the canonical release source root
        id: release-source
        run: git -c safe.directory="$GITHUB_WORKSPACE" worktree add --detach /workspace HEAD
      - name: Install the locked release tool environment
        working-directory: /workspace
        run: uv sync --locked --group quality --python python --no-python-downloads
      - name: Build the native release asset
        working-directory: /workspace
        run: uv run --locked --no-sync --python python --no-python-downloads nox -s release_asset -- "$GITHUB_WORKSPACE/.release-assets/linux-x86_64"
      - name: Retire the canonical release source root
        if: always() && steps.release-source.outcome == 'success'
        run: git -c safe.directory="$GITHUB_WORKSPACE" worktree remove --force /workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-linux-x86_64
          path: ${{ github.workspace }}/.release-assets/linux-x86_64
          if-no-files-found: error
          retention-days: 7
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  native-linux-lifecycle:
    name: Native lifecycle (linux-x86_64)
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref_type == 'tag')
    needs:
      - python-matrix
      - native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.release }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-linux-x86_64
          path: ${{ runner.temp }}/native-linux
      - name: Prepare the Linux executable destination
        run: install -d "$RUNNER_TEMP/native-linux/runtime"
      - name: Materialize the Linux executable
        run: tar -xzf "$RUNNER_TEMP"/native-linux/openai-responses-proxy-*-linux-x86_64.tar.gz --strip-components=1 -C "$RUNNER_TEMP/native-linux/runtime"
      - name: Install the locked release tool environment
        run: uv sync --locked --group quality
      - name: Start the runner user systemd manager
        shell: bash
        run: sudo systemctl start "user@${UID}.service"
      - name: Bind the runner user systemd environment
        shell: bash
        run: printf '%s\n' "XDG_RUNTIME_DIR=/run/user/${UID}" "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus" >> "$GITHUB_ENV"
      - name: Prove the native Linux service lifecycle
        env:
          OPENAI_RESPONSES_PROXY_NATIVE_EXECUTABLE: ${{ runner.temp }}/native-linux/runtime/bin/openai-responses-proxy
          OPENAI_RESPONSES_PROXY_NATIVE_BUNDLE: ${{ runner.temp }}/native-linux/runtime/bin
        run: uv run --locked --no-sync python -m pytest -q --rootdir . -c .config/checks/pytest/pytest.toml tests/release/lifecycle
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  release-compatibility:
    name: Published release compatibility (${{ matrix.platform }})
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: python-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.release }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Install the locked release tool environment
        run: uv sync --locked --group quality
      - name: Resolve the exact published predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python -m tools.release.publication predecessor --repository "${{ github.repository }}" --candidate-source . --github-environment "${{ github.env }}"
      - name: Download the published predecessor release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_TAG }}" --pattern "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-*-${{ matrix.platform }}.tar.gz" --pattern "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-${{ matrix.platform }}.manifest.json" --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir "${{ runner.temp }}/previous-release"
      - name: Materialize the release trust anchor
        env:
          PREVIOUS_RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
          RELEASE_ASSET_TRUST: ${{ vars.OPENAI_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: python -c "import os; from pathlib import Path; current = os.environ['RELEASE_ASSET_TRUST'].rstrip(); previous = os.environ['PREVIOUS_RELEASE_ASSET_TRUST'].rstrip() if os.environ['OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT'] == 'codex-responses-proxy' else current; assert current and previous, 'release trust is unavailable'; Path(r'${{ runner.temp }}/previous-release-asset-trust').write_text(previous + '\n', encoding='ascii'); Path(r'${{ runner.temp }}/release-asset-trust').write_text(current + '\n', encoding='ascii')"
      - name: Bind the exact predecessor asset
        run: python -c "import glob, os; matches = glob.glob(r'${{ runner.temp }}/previous-release/${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-*-${{ matrix.platform }}.tar.gz'); assert len(matches) == 1, matches; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_ASSET=' + matches[0] + '\n')"
      - if: matrix.platform == 'linux-x86_64'
        name: Start the runner user systemd manager
        shell: bash
        run: sudo systemctl start "user@${UID}.service"
      - if: matrix.platform == 'linux-x86_64'
        name: Bind the runner user systemd environment
        shell: bash
        run: printf '%s\n' "XDG_RUNTIME_DIR=/run/user/${UID}" "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus" >> "$GITHUB_ENV"
      - name: Prove published predecessor upgrade and rollback
        env:
          OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_TRUST_ANCHOR: ${{ runner.temp }}/previous-release-asset-trust
          OPENAI_RESPONSES_PROXY_CURRENT_RELEASE_TRUST_ANCHOR: ${{ runner.temp }}/release-asset-trust
        run: uv run --locked --no-sync nox -s release_compatibility
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  release-assets:
    name: Release assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - commit-admission
      - python-matrix
      - tag-metadata
      - native-assets
      - native-linux
      - native-linux-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.python-matrix.outputs.latest }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Download native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'native-*' --dir "$RUNNER_TEMP/native"
      - name: Install the complete locked tool environment
        run: uv sync --locked --all-groups
      - name: Prepare the protected release signing key destination
        run: install -m 600 /dev/null "$RUNNER_TEMP/release-asset-signing-key"
      - name: Materialize the protected release signing key
        env:
          RELEASE_ASSET_SIGNING_KEY_TEXT: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_SIGNING_KEY }}
        run: printf '%s\n' "$RELEASE_ASSET_SIGNING_KEY_TEXT" > "$RUNNER_TEMP/release-asset-signing-key"
      - name: Assemble, sign, and verify the release set
        env:
          RELEASE_ASSET_SIGNING_KEY_PATH: ${{ runner.temp }}/release-asset-signing-key
          RELEASE_ASSET_TRUST: ${{ vars.OPENAI_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: uv run --locked --no-sync python -m tools.release.artifact assemble --input "$RUNNER_TEMP/native/native-linux-x86_64" --input "$RUNNER_TEMP/native/native-macos-arm64" --input "$RUNNER_TEMP/native/native-windows-x86_64" --output "$RUNNER_TEMP/release-assets" --sign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 7
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  published-release-compatibility:
    name: Published release lifecycle (${{ matrix.platform }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .config/mise/python-release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          cache-suffix: ${{ github.job }}-${{ strategy.job-index }}
          version-file: .config/mise/uv.toml
      - name: Install the locked release tool environment
        run: uv sync --locked --group quality
      - name: Verify the selected release uses this product runtime
        run: git diff --exit-code "${{ github.event.release.tag_name || inputs.release_tag }}^{commit}" HEAD -- VERSION pyproject.toml uv.lock src/openai_responses_proxy
      - name: Resolve the exact published predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python -m tools.release.publication predecessor --repository "${{ github.repository }}" --candidate-tag "${{ github.event.release.tag_name || inputs.release_tag }}" --github-environment "${{ github.env }}"
      - name: Download the published current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name || inputs.release_tag }}" --pattern "openai-responses-proxy-*-${{ matrix.platform }}.tar.gz" --pattern "openai-responses-proxy-${{ matrix.platform }}.manifest.json" --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir "${{ runner.temp }}/current-release"
      - name: Download the published predecessor release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_TAG }}" --pattern "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-*-${{ matrix.platform }}.tar.gz" --pattern "${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-${{ matrix.platform }}.manifest.json" --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir "${{ runner.temp }}/previous-release"
      - name: Materialize the release trust anchor
        env:
          PREVIOUS_RELEASE_ASSET_TRUST: ${{ secrets.CODEX_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
          RELEASE_ASSET_TRUST: ${{ vars.OPENAI_RESPONSES_PROXY_RELEASE_ASSET_TRUST }}
        run: python -c "import os; from pathlib import Path; current = os.environ['RELEASE_ASSET_TRUST'].rstrip(); previous = os.environ['PREVIOUS_RELEASE_ASSET_TRUST'].rstrip() if os.environ['OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT'] == 'codex-responses-proxy' else current; assert current and previous, 'release trust is unavailable'; Path(r'${{ runner.temp }}/previous-release-asset-trust').write_text(previous + '\n', encoding='ascii'); Path(r'${{ runner.temp }}/release-asset-trust').write_text(current + '\n', encoding='ascii')"
      - name: Bind the exact published assets
        run: python -c "import glob, os; current = glob.glob(r'${{ runner.temp }}/current-release/openai-responses-proxy-*-${{ matrix.platform }}.tar.gz'); previous = glob.glob(r'${{ runner.temp }}/previous-release/${{ env.OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_PRODUCT }}-*-${{ matrix.platform }}.tar.gz'); assert len(current) == len(previous) == 1, (current, previous); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('OPENAI_RESPONSES_PROXY_CURRENT_RELEASE_ASSET=' + current[0] + '\nOPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_ASSET=' + previous[0] + '\n')"
      - if: matrix.platform == 'linux-x86_64'
        name: Start the runner user systemd manager
        shell: bash
        run: sudo systemctl start "user@${UID}.service"
      - if: matrix.platform == 'linux-x86_64'
        name: Bind the runner user systemd environment
        shell: bash
        run: printf '%s\n' "XDG_RUNTIME_DIR=/run/user/${UID}" "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus" >> "$GITHUB_ENV"
      - name: Prove the published release lifecycle
        env:
          OPENAI_RESPONSES_PROXY_PREVIOUS_RELEASE_TRUST_ANCHOR: ${{ runner.temp }}/previous-release-asset-trust
          OPENAI_RESPONSES_PROXY_CURRENT_RELEASE_TRUST_ANCHOR: ${{ runner.temp }}/release-asset-trust
        run: uv run --locked --no-sync nox -s published_release_compatibility -- --basetemp="${{ runner.temp }}/proxy-test"
    env:
      UV_CONFIG_FILE: .config/mise/uv.toml
      UV_NO_CONFIG: "false"
  branch-proof:
    name: Branch proof
    if: always()
    needs:
      - commit-admission
      - source-and-governance
      - python-matrix
      - python
      - python-windows
      - python-quality
      - performance
      - native-assets
      - native-linux
      - native-linux-lifecycle
      - release-compatibility
      - accepted-source
