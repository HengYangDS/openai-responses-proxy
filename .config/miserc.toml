# Read before the project's tool declaration: the ceiling stops discovery of parent configuration.
# Mise reads the operator's global configuration at startup all the same, so the project selects
# every tool that it runs itself.
ceiling_paths = ['{{ config_root | dirname | dirname }}']
ignored_config_paths = [
  '{{ env.MISE_CONFIG_DIR | default(value=xdg_config_home ~ "/mise") }}',
  '{{ env.MISE_GLOBAL_CONFIG_FILE | default(value=xdg_config_home ~ "/mise/config.toml") }}',
  '{{ env.MISE_SYSTEM_CONFIG_DIR | default(value="/etc/mise") }}',
]
