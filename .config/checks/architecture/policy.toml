owner = "repository-quality"
risk_model = "undeclared package owners and dependency edges create hidden coupling, ambiguous authority, and non-local change risk"
measurement = "parse the declared product package, imports, root modules, package declarations, and dependency cycles, and the domain cycles and test imports of every other source root, against this contract"
false_positive_cost = "a legitimate new semantic owner or dependency requires an intentional policy update reviewed with the implementation"
remediation = "move behavior to an existing owner or declare the new owner and dependency here with focused contract tests"
review_condition = "reassess when the product or repository-tool topology changes or two legitimate changes in one release train are blocked by the same contract"
source_roots = ["src/openai_responses_proxy", "tools"]
test_roots = ["tests"]
package_root = "src/openai_responses_proxy"
root_configuration_modules = ["noxfile.py"]
package_root_modules = ["errors", "json_value", "product_identity"]
package_initializers = "declarations-only"

[control_nesting]
max_depth = 5

[product_concepts]
request-admission = "src/openai_responses_proxy/relay/admission.py"
portable-responses = "src/openai_responses_proxy/protocol/replay/projection.py"
provider-adaptation = "src/openai_responses_proxy/providers/registry.py"
relay-transport = "src/openai_responses_proxy/relay/exchange.py"
runtime-configuration = "src/openai_responses_proxy/runtime/config.py"
payload-generations = "src/openai_responses_proxy/lifecycle/generation.py"
lifecycle-transactions = "src/openai_responses_proxy/lifecycle/transaction/execution.py"
native-supervision = "src/openai_responses_proxy/lifecycle/supervision/native_service.py"
cli-presentation = "src/openai_responses_proxy/cli/presentation.py"

[external_responsibilities]
provider-selection = "client-control-plane"
credentials = "client-control-plane"
client-configuration = "client-control-plane"
model-selection = "client"
conversation-history = "client"

[allowed_package_edges]
cli = ["errors", "lifecycle", "product_identity", "serving"]
lifecycle = [
  "errors",
  "json_value",
  "product_identity",
  "protocol",
  "providers",
  "relay",
  "runtime",
  "serving",
]
protocol = []
providers = []
relay = ["protocol", "providers", "runtime"]
serving = [
  "json_value",
  "product_identity",
  "protocol",
  "providers",
  "relay",
  "runtime",
]
runtime = ["product_identity"]
