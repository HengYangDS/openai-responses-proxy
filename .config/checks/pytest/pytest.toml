[pytest]
# Every report names each skipped case and its reason.
addopts = ["--import-mode=importlib", "-rs"]
strict_config = true
strict_markers = true
cache_dir = ".cache/pytest"
tmp_path_retention_policy = "none"
tmp_path_retention_count = "0"
filterwarnings = ["error"]
markers = [
  "native_distribution: requires the self-contained released executable",
  "native_observer: requires the attempt-selected ETHOS observer",
  "repository_toolchain: requires the repository-locked external toolchain",
]
testpaths = ["tests"]
python_classes = ["Test*", "*Tests", "*Contracts"]
