schema_version = 1
owner = "repository-quality"
purpose = "Classify every repository carrier once and assign each quality concern to one semantic owner and scope."

[[roles]]
id = "product-python"
description = "Installed product implementation."
owner = "product-runtime"
consumer = "installed executable and release artifacts"
source_of_truth = "tracked product source and public product contracts"
change_condition = "a product invariant or supported platform behavior changes"
dependency_direction = "public interfaces point inward to product implementation"
retirement_condition = "no supported runtime, artifact, or product contract consumes the carrier"
prefixes = ["src/"]

[[roles]]
id = "repository-python"
description = "Repository-owned build, verification, publication, and operations tooling."
owner = "repository-engineering"
consumer = "developers, CI, release automation, and maintainers"
source_of_truth = "tracked repository tooling and its executable contracts"
change_condition = "a build, verification, publication, or maintenance invariant changes"
dependency_direction = "repository automation depends on product contracts, never the reverse"
retirement_condition = "the owning workflow is removed or a native tool fully replaces the carrier"
files = ["noxfile.py"]
prefixes = ["tools/"]

[[roles]]
id = "test-python"
description = "Executable product and repository contract tests."
owner = "product-assurance"
consumer = "developers, CI, and release acceptance"
source_of_truth = "executable behavior and failure-path contracts"
change_condition = "a protected invariant, supported environment, or evidence boundary changes"
dependency_direction = "tests depend on public or intentionally exposed internal owners"
retirement_condition = "the protected invariant or supported evidence scope no longer exists"
prefixes = ["tests/"]

[[roles]]
id = "agent-guidance"
description = "Repository entry instructions for coding agents."
owner = "repository-governance"
consumer = "coding agents operating in this repository"
source_of_truth = "the repository entry contract and its linked authoritative policies"
change_condition = "agent authority, workflow, or repository entry requirements change"
dependency_direction = "guidance points to OpenSpec, ETHOS, and repository-owned authorities"
retirement_condition = "the repository no longer admits coding-agent work"
files = ["AGENTS.md"]

[[roles]]
id = "product-documentation"
description = "Human-facing product, contribution, and operating documentation."
owner = "product-documentation"
consumer = "users, operators, contributors, and maintainers"
source_of_truth = "released product behavior and durable architecture decisions"
change_condition = "a user journey, public concept, operation, or durable decision changes"
dependency_direction = "documentation points to executable product and governance authorities"
retirement_condition = "the documented surface is removed and no current reader path references it"
files = ["CONTRIBUTING.md", "README.md"]
prefixes = ["docs/"]

[[roles]]
id = "release-history"
description = "Chronological public release history."
owner = "release-management"
consumer = "users, operators, and release tooling"
source_of_truth = "published release identity and accepted change summaries"
change_condition = "a formal release is prepared or published"
dependency_direction = "release history derives from accepted product changes and version identity"
retirement_condition = "never for published entries; superseded development-only entries may be removed before release"
files = ["CHANGELOG.md"]

[[roles]]
id = "openspec"
description = "OpenSpec workspace, active changes, and immutable archived specifications."
owner = "product-change-governance"
consumer = "implementers, reviewers, ETHOS, and release acceptance"
source_of_truth = "official OpenSpec schemas, active Changes, and archived Changes"
change_condition = "product intent, acceptance, or Change lifecycle state changes"
dependency_direction = "implementation and evidence conform to OpenSpec intent"
retirement_condition = "active Change carriers retire only through official archive; archived records remain immutable"
prefixes = ["openspec/"]

[[roles]]
id = "ethos-adoption"
description = "Tracked ETHOS adoption declarations owned by this repository."
owner = "repository-governance"
consumer = "ETHOS runtime, hooks, and governed repository operations"
source_of_truth = "tracked adopter profile, workspace, and release declarations"
change_condition = "repository governance or lifecycle policy changes"
dependency_direction = "ETHOS consumes repository declarations without becoming product authority"
retirement_condition = "ETHOS adoption is explicitly removed and every governed consumer is retired"
prefixes = [".ethos/"]

[[roles]]
id = "ci-model"
description = "Provider-neutral continuous-integration model."
owner = "continuous-integration"
consumer = "GitHub and GitLab workflow projections"
source_of_truth = "provider-neutral CUE pipeline model"
change_condition = "CI semantics, stages, triggers, or evidence requirements change"
dependency_direction = "Forge-specific workflows derive from the provider-neutral model"
retirement_condition = "CI is retired or replaced by one equivalent provider-neutral authority"
prefixes = [".config/ci/"]

[[roles]]
id = "github-ci"
description = "GitHub Actions workflows projected from the provider-neutral CI model."
owner = "github-projection"
consumer = "GitHub Actions"
source_of_truth = "generated projection of the provider-neutral CI model"
change_condition = "the CI model or unavoidable GitHub-native syntax changes"
dependency_direction = "projection depends on the CI model and GitHub runner capabilities"
retirement_condition = "GitHub ceases to be a supported Forge and its projection has no consumer"
prefixes = [".github/"]

[[roles]]
id = "gitlab-ci"
description = "GitLab CI projection of the provider-neutral CI model."
owner = "gitlab-projection"
consumer = "GitLab CI"
source_of_truth = "generated projection of the provider-neutral CI model"
change_condition = "the CI model or unavoidable GitLab-native syntax changes"
dependency_direction = "projection depends on the CI model and GitLab runner capabilities"
retirement_condition = "GitLab ceases to be a supported Forge and its projection has no consumer"
files = [".gitlab-ci.yml"]

[[roles]]
id = "quality-policy"
description = "Repository-owned quality responsibilities and product-semantic policy."
owner = "repository-quality"
consumer = "quality gates, developers, CI, and reviewers"
source_of_truth = "repository-owned responsibility and semantic quality policy"
change_condition = "a protected risk, scope, threshold rationale, or ownership boundary changes"
dependency_direction = "native tools and orchestration implement the declared policy"
retirement_condition = "the protected concern disappears or a higher authority fully owns it"
files = [
  ".config/checks/architecture/policy.toml",
  ".config/checks/coverage/policy.toml",
  ".config/checks/deptry/policy.toml",
  ".config/checks/hard-coding/policy.toml",
  ".config/checks/performance/policy.toml",
  ".config/checks/responsibilities/policy.toml",
  ".config/checks/text-layout/policy.toml",
]

[[roles]]
id = "quality-tool-configuration"
description = "Native quality-tool configuration without product rationale."
owner = "repository-quality"
consumer = "locked native quality tools and their orchestration"
source_of_truth = "tool-native configuration projected from repository quality policy"
change_condition = "tool capability or the policy it implements changes"
dependency_direction = "configuration depends on policy and is consumed by its native tool"
retirement_condition = "the native tool is removed or its configuration becomes unnecessary"
files = [
  ".config/checks/coverage/coverage.toml",
  ".config/checks/gitleaks/gitleaks.toml",
  ".config/checks/lychee/lychee.toml",
  ".config/checks/prettier/prettier.toml",
  ".config/checks/pytest/pytest.toml",
  ".config/checks/ruff/ruff.toml",
  ".config/checks/taplo/taplo.toml",
  ".config/checks/ty/ty.toml",
  ".config/checks/vulture/vulture.toml",
]

[[roles]]
id = "editor-configuration"
description = "Cross-editor text defaults."
owner = "developer-experience"
consumer = "editors and text-producing tools"
source_of_truth = "cross-editor text conventions supported by repository format gates"
change_condition = "portable text-layout conventions change"
dependency_direction = "editor defaults conform to formatter-owned syntax"
retirement_condition = "all consuming editors and format checks cease to use the carrier"
files = [".editorconfig", ".gitattributes"]

[[roles]]
id = "toolchain"
description = "Locked language, dependency, build, and development toolchain declarations."
owner = "development-environment"
consumer = "developers, CI, build, test, and release sessions"
source_of_truth = "locked runtime, dependency, and tool declarations"
change_condition = "a supported runtime or verified stable dependency changes"
dependency_direction = "bootstrap and automation consume the lock-backed declarations"
retirement_condition = "the declared tool or dependency loses its final verified consumer"
files = [
  ".config/mise/python-release",
  ".config/mise/config.toml",
  ".config/mise/mise.lock",
  ".config/mise/uv.toml",
  ".config/miserc.toml",
  ".config/npm/npmrc",
  "package-lock.json",
  "package.json",
  "pyproject.toml",
  "uv.lock",
]

[[roles]]
id = "source-control-configuration"
description = "Source-control behavior declared by this repository."
owner = "repository-governance"
consumer = "Git, developers, automation, and cleanup checks"
source_of_truth = "tracked source-control inclusion and exclusion policy"
change_condition = "a durable generated path or tracked artifact class changes"
dependency_direction = "source-control policy follows repository ownership and evidence retention"
retirement_condition = "Git is no longer the repository transport or an entry has no matching artifact class"
files = [".gitignore"]

[[roles]]
id = "product-identity"
description = "Canonical product version and licensing identity."
owner = "product-release"
consumer = "runtime, packaging, documentation, and release automation"
source_of_truth = "canonical product name, version, and licence declarations"
change_condition = "product identity, version, or licensing changes"
dependency_direction = "all identity projections derive from these canonical declarations"
retirement_condition = "the product is retired and no release, installation, or legal consumer remains"
files = ["LICENSE", "VERSION"]

[[scopes]]
id = "all-carriers"
roles = [
  "product-python",
  "repository-python",
  "test-python",
  "agent-guidance",
  "product-documentation",
  "release-history",
  "openspec",
  "ethos-adoption",
  "ci-model",
  "github-ci",
  "gitlab-ci",
  "quality-policy",
  "quality-tool-configuration",
  "editor-configuration",
  "toolchain",
  "source-control-configuration",
  "product-identity",
]

[[scopes]]
id = "python"
roles = ["product-python", "repository-python", "test-python"]

[[scopes]]
id = "production-python"
roles = ["product-python", "repository-python"]

[[scopes]]
id = "documentation"
roles = ["agent-guidance", "product-documentation", "release-history"]

[[scopes]]
id = "prettier-formatted"
roles = [
  "openspec",
  "agent-guidance",
  "product-documentation",
  "release-history",
  "ci-model",
  "github-ci",
  "gitlab-ci",
]

[[scopes]]
id = "toml-formatted"
roles = [
  "product-python",
  "ethos-adoption",
  "quality-policy",
  "quality-tool-configuration",
  "toolchain",
]

[[scopes]]
id = "cue-formatted"
roles = ["ci-model"]

[[scopes]]
id = "ci"
roles = ["ci-model", "github-ci", "gitlab-ci"]

[[scopes]]
id = "release"
roles = ["release-history", "ethos-adoption", "toolchain", "product-identity"]

[[concerns]]
id = "controlled-values"
owner = "tools.quality.hard_coding"
scope = "all-carriers"
session = "quick"
configuration = [".config/checks/hard-coding/policy.toml"]
risk_model = "Duplicated product identity, policy, supply-chain, and generated values drift across runtime, release, documentation, and Forge projections."
measurement = "Validate one declared owner, rationale, class, and projection set for every controlled-value family and run focused semantic consistency checks."
false_positive_cost = "An incidental literal must not be promoted into policy; only values whose drift changes product, governance, release, or portability semantics are controlled."
remediation = "Move the value to its semantic owner and derive or validate every projection rather than adding another source."
review_condition = "Reassess when a new product identity facet, policy surface, supply-chain carrier, or generated projection is introduced."

[[concerns]]
id = "python-lint"
owner = "ruff"
scope = "python"
session = "quick"
configuration = [".config/checks/ruff/ruff.toml"]
risk_model = "Python correctness, import, modernization, security, performance, and maintainability defects escape review."
measurement = "Ruff checks every Python carrier, native C901 complexity, and explicit public/special-method returns for product, tooling and Nox; real-tool probes verify admission."
false_positive_cost = "Pytest owns fixture injection, so tests omit missing-return rules but retain type checking. Other applicability changes require review."
remediation = "Correct or simplify the owning implementation; change applicability only with a reviewed responsibility-map update."
review_condition = "Reassess when Ruff adds a relevant stable rule family or repeated cohesive operations exceed the native complexity bound; review lower-bound findings semantically rather than forcing forwarding helpers."

[[concerns]]
id = "python-format"
owner = "ruff"
scope = "python"
session = "quick"
configuration = [".config/checks/ruff/ruff.toml"]
risk_model = "Inconsistent source layout raises review cost and permits host-dependent formatting drift."
measurement = "Ruff formatter verification over every Python carrier."
false_positive_cost = "Formatter changes must preserve syntax and must not encode product policy."
remediation = "Apply the locked formatter to the owning Python carrier."
review_condition = "Reassess when the supported Python grammar or formatter contract changes."

[[concerns]]
id = "python-public-docstrings"
owner = "ruff"
scope = "python"
session = "quick"
configuration = [".config/checks/ruff/ruff.toml"]
risk_model = "Undocumented public product and repository interfaces make behavior ambiguous to users and maintainers."
measurement = "One Ruff invocation enforces Google-style docstrings across Python; missing-docstring rules apply to product and tooling, while existing test prose is validated without requiring ornamental comments."
false_positive_cost = "Behavior-named tests do not require docstrings; the native tests/** D1 applicability rule excludes only missing-docstring diagnostics, not malformed existing prose."
remediation = "Document the public contract or make the symbol private when it is not an interface."
review_condition = "Reassess when a public surface becomes private or a native checker expresses the boundary more precisely."

[[concerns]]
id = "python-types"
owner = "ty"
scope = "python"
session = "quick"
configuration = [".config/checks/ty/ty.toml"]
risk_model = "Unsound boundaries and platform-specific assumptions can fail only after installation on a supported host."
measurement = "All ty diagnostics are errors under Python 3.12 semantics and the all-platform model."
false_positive_cost = "Incomplete third-party stubs can require explicit validated adapters at integration boundaries."
remediation = "Validate and narrow external values or isolate platform APIs behind typed capability boundaries."
review_condition = "Reassess when supported Python versions, platforms, or third-party stub contracts change."

[[concerns]]
id = "python-package-architecture"
owner = "tools.quality.repository.topology"
scope = "production-python"
session = "quick"
configuration = [".config/checks/architecture/policy.toml"]
risk_model = "Undeclared package edges create parallel ownership and non-local change risk."
measurement = "Repository-semantic analysis of declared package owners, imports, and dependency cycles."
false_positive_cost = "A legitimate new owner requires an explicit architectural decision."
remediation = "Move behavior to its existing owner or declare the new owner and edge with focused tests."
review_condition = "Reassess when product topology changes."

[[concerns]]
id = "python-control-depth"
owner = "tools.quality.repository"
scope = "python"
session = "quick"
configuration = [".config/checks/architecture/policy.toml"]
risk_model = "Deeply nested guards obscure validation, effects and cleanup ownership even when cyclomatic complexity is bounded."
measurement = "Measure control blocks independently in every module, class and function; same-indent elif clauses are siblings. The single max_depth value is enforced across product, tools, tests and Nox."
false_positive_cost = "The bound follows Ruff's native five-block guidance, not the current maximum. Its nesting rule is preview-only; enabling preview changes unrelated rule semantics, so the existing audit owns this gap until stable."
remediation = "Flatten guards or simplify the responsible transition without moving recovery and teardown into forwarding helpers; preserve valid byte-for-byte and lifecycle journeys."
review_condition = "Reassess when Ruff's nesting rule becomes stable or a cohesive transition cannot retain its invariant at the declared depth."

[[concerns]]
id = "python-tests"
owner = "pytest"
scope = "python"
session = "tests"
configuration = [".config/checks/pytest/pytest.toml"]
risk_model = "Product behavior can regress without executable contracts across every supported Python runtime."
measurement = "Warnings-as-errors pytest execution against installed artifacts on Python 3.12, 3.13, and 3.14."
false_positive_cost = "Host-native capabilities cannot be proved by emulation and remain separate explicit evidence."
remediation = "Repair the behavior or its test fixture at the owning boundary."
review_condition = "Reassess when the supported runtime or native-platform matrix changes."

[[concerns]]
id = "python-coverage"
owner = "coverage.py"
scope = "production-python"
session = "quality"
configuration = [
  ".config/checks/coverage/coverage.toml",
  ".config/checks/coverage/policy.toml",
]
risk_model = "Unobserved lifecycle, protocol, release, and verification branches permit silent regressions or false acceptance."
measurement = "Independent statement and branch floors for every native-configured product, tooling, and orchestration root; unexecuted namespace files remain in the denominator and every semantic package requires execution evidence."
false_positive_cost = "Per-file floors can reward fragmentation; source roots remain separate risk boundaries and branchless roots require only measured statements."
remediation = "Test meaningful behavior, delete unreachable code, or simplify the responsible package."
review_condition = "Reassess after escaped defects or repeated legitimate denominator-only failures; never narrow scope to make a current implementation pass."

[[concerns]]
id = "python-dependencies"
owner = "deptry"
scope = "product-python"
session = "governance"
configuration = [".config/checks/deptry/policy.toml", "pyproject.toml", "uv.lock"]
risk_model = "Undeclared, obsolete, or misplaced dependencies make builds non-reproducible and enlarge the supply chain."
measurement = "Locked dependency resolution and Deptry analysis of the installed product package."
false_positive_cost = "Build-only and platform-specific dependencies require correct group ownership rather than exclusions."
remediation = "Declare the dependency in its owning group or remove its last consumer."
review_condition = "Reassess when packaging or supported platforms change."

[[concerns]]
id = "python-unused-code"
owner = "vulture"
scope = "production-python"
session = "governance"
configuration = [".config/checks/vulture/vulture.toml"]
risk_model = "Unreachable implementation preserves obsolete semantics and raises maintenance cost."
measurement = "High-confidence Vulture analysis of product and repository tool Python."
false_positive_cost = "Dynamic framework entrypoints may look unused and must instead be proved through an explicit executable entrypoint."
remediation = "Delete dead behavior or connect the real entrypoint without a waiver list."
review_condition = "Reassess when an admitted framework changes static discoverability."

[[concerns]]
id = "text-bytes"
owner = "tools.quality.text_layout"
scope = "all-carriers"
session = "quick"
configuration = [".config/checks/text-layout/policy.toml", ".editorconfig"]
risk_model = "Host-dependent bytes create noisy diffs and parser disagreement."
measurement = "UTF-8, LF, final-newline, and trailing-whitespace verification over declared text carriers."
false_positive_cost = "Binary or generated carriers must be correctly classified instead of forced through text rules."
remediation = "Format with the native owner or correct the carrier role."
review_condition = "Reassess when a supported platform cannot preserve a declared invariant."

[[concerns]]
id = "markdown-yaml-format"
owner = "prettier"
scope = "prettier-formatted"
session = "governance"
configuration = [".config/checks/prettier/prettier.toml"]
risk_model = "Inconsistent Markdown and YAML structure raises review cost and can obscure semantic drift across documentation and generated Forge projections."
measurement = "Locked Prettier checks every current Markdown and YAML authority while immutable OpenSpec archives remain byte-stable."
false_positive_cost = "Formatting must preserve authored prose wrapping and must not rewrite immutable historical evidence."
remediation = "Apply the locked Prettier version to current Markdown and YAML carriers through the repository governance session."
review_condition = "Reassess when Prettier changes supported syntax or a new current Markdown or YAML role is introduced."

[[concerns]]
id = "toml-format"
owner = "taplo"
scope = "toml-formatted"
session = "governance"
configuration = [".config/checks/taplo/taplo.toml"]
risk_model = "Noncanonical TOML layout makes configuration ownership harder to review and permits tool-dependent rewrites."
measurement = "Locked Taplo validates and checks formatting for every current TOML authority while immutable OpenSpec archives remain byte-stable."
false_positive_cost = "Formatting must preserve semantic key order where ordering communicates repository intent."
remediation = "Apply the locked Taplo formatter to current TOML carriers through its single native configuration."
review_condition = "Reassess when Taplo changes stable formatting semantics or a new current TOML role is introduced."

[[concerns]]
id = "cue-format"
owner = "cue"
scope = "cue-formatted"
session = "governance"
configuration = [".config/ci/graph/proof.cue", "tools/ci/project.py"]
risk_model = "A noncanonical CI model increases projection review cost and can conceal divergence between the Forge renderings."
measurement = "The locked CUE formatter checks the provider-neutral CI model before validation and projection verification."
false_positive_cost = "CUE formatting is syntax-aware and must not be replaced by a generic text formatter."
remediation = "Apply the locked CUE formatter to the canonical CI model."
review_condition = "Reassess when another CUE authority is introduced or the CUE formatter contract changes."

[[concerns]]
id = "documentation-links"
owner = "lychee"
scope = "documentation"
session = "governance"
configuration = [".config/checks/lychee/lychee.toml"]
risk_model = "Broken local or external references make otherwise correct documentation unusable."
measurement = "Lychee validates documentation links, offline deterministically and online before publication."
false_positive_cost = "Transient external failure can block publication and therefore requires bounded retries."
remediation = "Correct the target or replace the unstable external dependency with durable documentation."
review_condition = "Reassess after recurring failures from a legitimate stable domain."

[[concerns]]
id = "repository-secrets"
owner = "gitleaks"
scope = "all-carriers"
session = "governance"
configuration = [".config/checks/gitleaks/gitleaks.toml"]
risk_model = "Committed credentials or private material can compromise users and publication infrastructure."
measurement = "Gitleaks scans current repository content and Git history with redacted diagnostics."
false_positive_cost = "Test fixtures that resemble secrets must use structurally non-secret data."
remediation = "Remove and rotate exposed material; redesign fixtures instead of adding allowlists."
review_condition = "Reassess when secret formats or publication credentials change."

[[concerns]]
id = "ci-model-validation"
owner = "cue"
scope = "ci"
session = "governance"
configuration = [".config/ci/graph/proof.cue", "tools/ci/project.py"]
risk_model = "Independently handwritten Forge workflows drift in triggers, proof strength, and release behavior."
measurement = "CUE and repository contracts prove GitHub and GitLab are projections of one CI model."
false_positive_cost = "Runner-native setup may differ while semantic jobs and evidence remain isomorphic."
remediation = "Change the CUE owner and update both projections in one atom."
review_condition = "Reassess when either Forge gains a materially different required capability."

[[concerns]]
id = "github-workflow-syntax"
owner = "actionlint"
scope = "github-ci"
session = "governance"
configuration = [
  ".github/workflows/admission.yml",
  ".github/workflows/verify.yml",
]
risk_model = "Invalid GitHub workflow syntax can make the public proof plane silently unavailable."
measurement = "Actionlint validates every tracked GitHub Actions projection."
false_positive_cost = "Provider-specific syntax must remain distinct from product-semantic CI behavior."
remediation = "Correct the CUE owner, regenerate its workflows, and rerun Actionlint."
review_condition = "Reassess when GitHub Actions syntax or the projection generator changes."

[[concerns]]
id = "openspec-validation"
owner = "openspec"
scope = "openspec"
session = "governance"
configuration = ["openspec/config.yaml"]
risk_model = "Implementation can diverge from declared behavior or archive incomplete lifecycle state."
measurement = "OpenSpec strict validation of active and archived change carriers."
false_positive_cost = "Historical archives remain immutable evidence and are not reformatted as live authority."
remediation = "Correct the active specification or explicitly reopen the affected semantic change."
review_condition = "Reassess when the OpenSpec schema or lifecycle model changes."

[[concerns]]
id = "commit-message-grammar"
owner = "ethos"
scope = "all-carriers"
session = "git-admission"
configuration = [".ethos/workspace.toml"]
risk_model = "Unstructured commit subjects make release history difficult to search, automate, and audit."
measurement = "Original ETHOS commit, integration and publication admission against its shared grammar, local scope constraints and external signature trust."
false_positive_cost = "A legitimate new semantic scope requires an intentional policy update."
remediation = "Choose the nearest existing semantic scope or add one reviewed scope with the behavior that needs it."
review_condition = "Reassess when the product gains a durable semantic owner."

[[concerns]]
id = "decision-record-integrity"
owner = "ethos"
scope = "product-documentation"
session = "git-admission"
configuration = [".ethos/profile.toml"]
risk_model = "Durable architectural decisions can become undiscoverable, inconsistently named, or detached from their supersession state."
measurement = "Original ETHOS Docs Registry validates decision identity, metadata, complete rationale and referenced carriers."
false_positive_cost = "Routine implementation choices must not generate ceremonial decision records."
remediation = "Preserve durable rationale in the native record and navigate it from the directory README."
review_condition = "Reassess when the decision lifecycle or naming contract changes."

[[concerns]]
id = "semantic-path-names"
owner = "tools.quality.repository.names"
scope = "all-carriers"
session = "quick"
configuration = [".config/checks/responsibilities/policy.toml"]
risk_model = "Compressed, historical, or implementation-leaking names obscure responsibility and encourage parallel semantics."
measurement = "Validate current authoritative path segments against the repository naming contract."
false_positive_cost = "Established external protocol and vendor names must retain their canonical spelling."
remediation = "Rename the carrier to its narrow semantic responsibility and update every live reference in the same atom."
review_condition = "Reassess when a new durable repository responsibility is introduced."

[[concerns]]
id = "product-performance"
owner = "pyperf"
scope = "product-python"
session = "performance"
configuration = [".config/checks/performance/policy.toml"]
risk_model = "Unmeasured request and lifecycle overhead can degrade interactive use while functional behavior remains correct."
measurement = "Process-isolated measurements of provider resolution, Responses projection, lifecycle readiness, loopback forwarding, and peak memory."
false_positive_cost = "Host noise can move absolute latency, so review uses distributions rather than a single wall-clock sample."
remediation = "Reproduce the regressed metric, profile its semantic owner, and remove the bottleneck without weakening correctness."
review_condition = "Reassess workloads and budgets when production traces identify a new dominant path."

[[concerns]]
id = "release-identity"
owner = "tools.release.metadata"
scope = "release"
session = "release"
configuration = [
  "VERSION",
  "CHANGELOG.md",
  "pyproject.toml",
  ".ethos/release.toml",
]
risk_model = "Inconsistent version, tag, changelog, and artifact identity breaks reproducible publication."
measurement = "Release metadata and black-box artifact verification bind one SemVer identity to one signed source commit."
false_positive_cost = "A development checkout must remain distinguishable from a publishable release."
remediation = "Repair the canonical VERSION and derived release carriers before publication."
review_condition = "Reassess when the release or signing model changes."

[[concerns]]
id = "quality-responsibility-map"
owner = "tools.quality.responsibilities"
scope = "all-carriers"
session = "quick"
configuration = [".config/checks/responsibilities/policy.toml"]
