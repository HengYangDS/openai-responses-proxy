schema_version = 1
owner = "repository-quality"
purpose = "Assign every intentionally controlled value class to one source owner and distinguish authored policy from generated projections."
allowed_kinds = [
  "derived-projection",
  "domain-constant",
  "policy-parameter",
  "supply-chain-pin",
]

[[controls]]
id = "product-slug"
kind = "domain-constant"
owner = "src/openai_responses_proxy/product_identity.py"
invariant = "Every public identity projection denotes one product and command namespace."
rationale = "The package, command, service, environment namespace, asset prefix, and release title are facets of one product identity."
projections = [
  "pyproject.toml",
  "README.md",
  "docs/",
  "src/",
  "tools/",
  "tests/",
]
projection_checks = [
  { source = "PACKAGE_NAME", target = "pyproject.toml", selector = "project.name", match = "toml-value" },
  { source = "COMMAND_NAME", target = "pyproject.toml", selector = "project.scripts", match = "toml-key" },
]

[[controls]]
id = "runtime-policy"
kind = "policy-parameter"
owner = "src/openai_responses_proxy/runtime/config.py"
invariant = "Every runtime setting is validated once before any process or service consumes it."
surfaces = ["configuration-field", "environment-variable"]
rationale = "Ports, time budgets, retry budgets, log retention, and portable data locations are validated runtime policy rather than call-site literals."
projections = ["README.md", "docs/", "src/", "tests/"]

[[controls]]
id = "provider-catalog"
kind = "domain-constant"
owner = "src/openai_responses_proxy/providers/manifest.toml"
invariant = "Every supported provider route resolves explicitly without an implicit default."
surfaces = ["network-provider-route"]
rationale = "Provider route names, origins, and optional wire policies form one released product catalog."
projections = ["README.md", "src/", "tests/"]

[[controls]]
id = "release-python"
kind = "supply-chain-pin"
owner = ".config/ci/graph/toolchains.cue"
invariant = "Every native release is built by one exact reproducible Python runtime."
rationale = "The CUE release-runtime declaration projects one exact Python patch and immutable Linux image for local and hosted construction."
projections = [
  ".config/mise/python-release",
  ".config/ci/linux-release-image",
  "noxfile.py",
  "tools/",
  "tests/",
]

[[controls]]
id = "python-dependencies"
kind = "supply-chain-pin"
owner = "uv.lock"
invariant = "Every Python dependency resolves from one complete hash-locked graph."
rationale = "Resolved Python dependency versions and hashes are owned by the universal lock."
projections = ["pyproject.toml"]

[[controls]]
id = "standalone-tools"
kind = "supply-chain-pin"
owner = ".config/mise/mise.lock"
invariant = "Every standalone repository tool resolves from one integrity-locked graph."
rationale = "Language runtimes and standalone executable versions and integrity are owned by the mise lock."
projections = [".config/mise/config.toml", ".config/ci/"]

[[controls]]
id = "native-workflow-executor"
kind = "supply-chain-pin"
owner = ".config/mise/config.toml"
invariant = "Workflow checks use the locked original Actionlint, ShellCheck and Pyflakes executables on every native platform."
rationale = "CUE declares admission policy and Python owns its validation; short native commands avoid the long-script stdin defect without a Docker prerequisite or disabled integration."
projections = [
  "CONTRIBUTING.md",
  "tools/quality/governance.py",
  "tests/quality/",
]

[[controls]]
id = "node-repository-tools"
kind = "supply-chain-pin"
owner = "package-lock.json"
invariant = "Every Node repository tool resolves from one complete lockfile."
rationale = "Repository Node tools and their complete transitive dependency graph are owned by the npm lock."
projections = ["package.json", ".config/npm/npmrc", ".config/ci/"]

[[controls]]
id = "ci-proof-graph"
kind = "derived-projection"
owner = ".config/ci/"
invariant = "Generated Forge CI artifacts implement the same provider-neutral verification semantics and exercise every declared Python series."
rationale = "GitHub, GitLab and Nox consume one proof graph and ordered Python compatibility matrix."
projections = [
  ".config/ci/python-versions",
  ".github/workflows/admission.yml",
  ".github/workflows/verify.yml",
  ".gitlab-ci.yml",
  "CONTRIBUTING.md",
  "docs/",
  "noxfile.py",
  "tests/",
]

[[controls]]
id = "quality-thresholds"
kind = "policy-parameter"
owner = ".config/checks/responsibilities/policy.toml"
invariant = "Every quality requirement has one policy owner and one executable enforcement path."
rationale = "The responsibility map selects one native configuration or repository policy for each threshold; it records rationale without duplicating the numeric value."
projections = [
  ".config/checks/",
  "noxfile.py",
  "tools/quality/",
  "tests/quality/",
]

[[controls]]
id = "release-platforms"
kind = "domain-constant"
owner = "tools/release/artifact/format.py"
invariant = "Every published platform has one canonical archive, manifest, checksum, and signature identity."
surfaces = ["release-artifact"]
rationale = "The published native platform set and asset grammar form one release-domain contract."
projections = [".config/ci/", "docs/", "tests/release/"]

[[controls]]
id = "public-cli"
kind = "domain-constant"
owner = "src/openai_responses_proxy/cli/application.py"
invariant = "Every public command and result has one typed command-boundary implementation."
surfaces = ["public-command", "public-result"]
rationale = "Command grammar, exit status, machine result, and human presentation enter through one public application boundary."
projections = [
  "README.md",
  "docs/",
  "src/openai_responses_proxy/cli/",
  "tests/cli/",
]

[[controls]]
id = "control-routes"
kind = "domain-constant"
owner = "src/openai_responses_proxy/serving/server.py"
invariant = "Every loopback control route is explicit and remains separate from relayed Provider traffic."
surfaces = ["network-control-route"]
rationale = "Health, drain, and handoff are product-owned control routes rather than Provider catalog entries."
projections = ["docs/", "src/openai_responses_proxy/serving/", "tests/serving/"]

[[controls]]
id = "native-resources"
kind = "domain-constant"
owner = "src/openai_responses_proxy/lifecycle/context.py"
invariant = "Every installed service, process, path, listener, and payload belongs to one exact runtime context."
surfaces = ["native-resource"]
rationale = "Native lifecycle creation and teardown require one portable resource identity and ownership boundary."
projections = [
  "docs/",
  "src/openai_responses_proxy/lifecycle/",
  "tests/lifecycle/",
  "tests/serving/",
]

[[controls]]
id = "documentation-entrypoint"
kind = "derived-projection"
owner = "docs/README.md"
invariant = "Every current product and repository document is reachable from one intentional navigation root."
surfaces = ["documentation-entrypoint"]
rationale = "The documentation root is the sole reader-facing index; subordinate indexes exist only for a distinct navigation scope."
projections = ["README.md", "docs/", "tests/quality/"]
