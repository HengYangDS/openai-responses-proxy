target-version = "py312"
line-length = 100
# Pytest imports tests in importlib mode, and test modules import shared fixtures through the
# implicit tests namespace, so no test directory is a regular package.
namespace-packages = ["tests"]

[format]
docstring-code-format = true
line-ending = "lf"

[lint.isort]
force-single-line = true

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 20

[lint]
select = [
  # Linters that apply in full.
  "A",
  "AIR",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "D",
  "DJ",
  "DTZ",
