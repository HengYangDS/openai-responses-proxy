ignore = [
  # Ruff documents that this rule conflicts with its formatter, which owns trailing commas.
  "COM812",
  # LICENSE and pyproject.toml declare the MIT license and its holder once; a notice in every
  # file would copy that declaration into each carrier.
  "CPY001",
  # Gitleaks owns committed-secret detection over content and history; these name
  # heuristics report credential-kind names and header names, not secrets.
  "S105",
  "S106",
  "S107",
  # Ruff reports every non-literal URL. Each URL is admitted with an http or https scheme
  # at its owner: the provider registry, loopback_url and the GitLab API base check.
  "S310",
  # Ruff flags each subprocess call whose argument list is computed; every flagged call passes
  # an argument list, never a shell string, built by its owner from validated values.
  "S603",
  # The only product XML is the Windows Task Scheduler's own export and tests parse fixtures;
  # ElementTree and minidom resolve no external entities, and Expat limits entity expansion
  # on every supported Python (Python documentation, "XML vulnerabilities").
  "S314",
  "S318",
  # Ruff marks the pathlib fix unsafe: no pathlib form makes a path absolute and removes ".."
  # without resolving links, as the lexical install and process identities require.
  "PTH100",
  # On Python 3.12, Path.exists raises PermissionError under an unreadable directory, where
  # os.path.exists returns False.
  "PTH110",
  # Ruff marks the fix unsafe: Path.expanduser raises when no home directory is known,
  # where os.path.expanduser returns its input.
  "PTH111",
  # Ruff marks these fixes unsafe: Path.name and Path.parent normalize separators and dots,
  # so they can differ from the exact os.path.basename and os.path.dirname strings.
  "PTH119",
  "PTH120",
  # Task 7.5 made C901 at 20 the function-complexity authority and rejected shallow
  # extraction; these counters re-measure that property at lower, unjustified thresholds.
  "PLR0911",
  "PLR0912",
  "PLR0915",
  # PLR0917 owns positional-argument ambiguity; keyword-only parameters carry no ordering risk.
  "PLR0913",
  # Exceptions are this product's diagnostics: their messages stay beside the condition they
  # describe, and the CLI renders expected errors without a traceback.
  "TRY003",
  "EM101",
  "EM102",
]

[lint.per-file-ignores]
# PyInstaller loads its hook files by path from this hooks directory; it is not a package.
"tools/release/hooks/*" = ["INP001"]
# The CLI writes the program's output, and its service roles import their modules only after
# runtime activation.
"src/openai_responses_proxy/cli/application.py" = ["T201", "PLC0415"]
# Platform adapters import at first use, so an incomplete installation reports the product's
# assembly error; a test exercises that import failure.
"src/openai_responses_proxy/lifecycle/supervision/native_service.py" = ["PLC0415"]
# The release verifier reads RuntimeContext's field types with typing.get_type_hints.
"src/openai_responses_proxy/lifecycle/context.py" = ["TC001", "TC002", "TC003"]
# These modules write their program's output, and Cyclopts reads their command annotations
# at run time.
"tools/performance/verify.py" = ["T201", "TC003"]
"tools/release/tag_signature.py" = ["T201", "TC003"]
# GitHub reads workflows as YAML 1.2, where the on key is a string; this SafeLoader subclass
# only drops the YAML 1.1 booleans that yaml.safe_load would apply to that key.
"tests/forge/workflows/fixtures.py" = ["S506"]
# Carrier snapshots compare exact link targets, and Path.readlink normalizes them (t/ to t).
"tests/lifecycle/transaction/fixtures.py" = ["PTH115"]
# Each of these modules writes its program's output.
"tools/forge/audit.py" = ["T201"]
"tools/quality/branch_coverage.py" = ["T201"]
"tools/quality/governance.py" = ["T201"]
"tools/quality/hard_coding.py" = ["T201"]
"tools/quality/repository/__main__.py" = ["T201"]
"tools/quality/responsibilities.py" = ["T201"]
"tools/release/artifact/__main__.py" = ["T201"]
"tools/release/artifact/bundle.py" = ["T201"]
"tools/release/metadata.py" = ["T201"]
"tools/release/publication/__main__.py" = ["T201"]
# Repository tooling, Nox and tests find the Mise-managed tools through PATH by design.
"tools/**" = ["S607"]
"noxfile.py" = ["S607"]
"tests/**" = [
  # Tests expose no product or repository interface: pytest collects their behavior-named
  # classes, functions and methods. Module docstrings and existing prose are still checked.
  "D101",
  "D102",
  "D103",
  # Pytest calls tests and fixtures by name and fails a test that returns a value.
  "ANN201",
  # Pytest rewrites assert statements into its own failure reports.
  "S101",
  # Tests change in the same commit as the private state they read, so the coupling cannot
  # break silently.
  "SLF001",
  # A test's comparison literal is the expected value that the test specifies.
  "PLR2004",
  # Tests find the Mise-managed tools through PATH by design.
  "S607",
]
