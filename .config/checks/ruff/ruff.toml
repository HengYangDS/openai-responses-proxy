target-version = "py312"
line-length = 100

[format]
docstring-code-format = true
line-ending = "lf"

[lint.isort]
force-single-line = true

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 20

[lint]
select = [
  # Linters that apply in full.
  "A",
  "AIR",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "D",
  "DJ",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FAST",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PLE",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLOT",
  "T10",
  "TD",
  "TID",
  "UP",
  "W",
  "YTT",
  # Single rules of linters that are not selected in full.
  "ANN201",
  "ANN204",
  "PLC0414",
  "PLW0108",
  "PLW1510",
  "PLW2901",
  "S102",
  "S104",
  "S307",
  "S602",
  "S604",
  "S605",
  "S606",
  "S608",
  "S609",
  "S610",
  "S611",
  "S612",
  "S701",
]

[lint.per-file-ignores]
"tests/**" = [
  # Tests expose no product or repository interface: pytest collects their behavior-named
  # classes, functions and methods. Module docstrings and existing prose are still checked.
  "D101",
  "D102",
  "D103",
  # Pytest calls tests and fixtures by name and fails a test that returns a value.
  "ANN201",
]
