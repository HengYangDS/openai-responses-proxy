ignore = [
  # Ruff documents that this rule conflicts with its formatter, which owns trailing commas.
  "COM812",
  # LICENSE and pyproject.toml declare the MIT license and its holder once; a notice in every
  # file would copy that declaration into each carrier.
  "CPY001",
  # Gitleaks owns committed-secret detection over content and history; these name
  # heuristics report credential-kind names and header names, not secrets.
  "S105",
  "S106",
  "S107",
  # Ruff reports every non-literal URL. Each URL is admitted with an http or https scheme
  # at its owner: the provider registry, loopback_url and the GitLab API base check.
  "S310",
  # Ruff documents that it cannot tell validated arguments apart, so it reports every
  # argument-list subprocess call; S602, S604 and S605 still forbid shell invocation.
  "S603",
  # Executables resolve through PATH by design: Mise puts the locked tools on PATH and
  # the service managers live in platform directories; shutil.which repeats that lookup.
  "S607",
  # The only product XML is the Windows Task Scheduler's own export and tests parse fixtures;
  # ElementTree and minidom resolve no external entities, and Expat limits entity expansion
  # on every supported Python (Python documentation, "XML vulnerabilities").
  "S314",
  "S318",
  # Ruff marks the pathlib fix unsafe: no pathlib form makes a path absolute and removes ".."
  # without resolving links, as the lexical install and process identities require.
  "PTH100",
  # On Python 3.12, Path.exists raises PermissionError under an unreadable directory, where
  # os.path.exists returns False.
  "PTH110",
  # Ruff marks the fix unsafe: Path.expanduser raises when no home directory is known,
  # where os.path.expanduser returns its input.
  "PTH111",
  # Ruff marks these fixes unsafe: Path.name and Path.parent normalize separators and dots,
  # so they can differ from the exact os.path.basename and os.path.dirname strings.
  "PTH119",
  "PTH120",
  # Task 7.5 made C901 at 20 the function-complexity authority and rejected shallow
  # extraction; these counters re-measure that property at lower, unjustified thresholds.
  "PLR0911",
  "PLR0912",
  "PLR0915",
  # PLR0917 owns positional-argument ambiguity; keyword-only parameters carry no ordering risk.
  "PLR0913",
]

[lint.per-file-ignores]
# PyInstaller loads its hook files by path from this hooks directory; it is not a package.
"tools/release/hooks/*" = ["INP001"]
"tests/**" = [
  # Tests expose no product or repository interface: pytest collects their behavior-named
  # classes, functions and methods. Module docstrings and existing prose are still checked.
  "D101",
  "D102",
  "D103",
  # Pytest calls tests and fixtures by name and fails a test that returns a value.
  "ANN201",
  # Pytest rewrites assert statements into its own failure reports.
  "S101",
  # Tests arrange and observe the private state that product modules keep unexported.
  "SLF001",
  # A test's comparison literal is the expected value that the test specifies.
  "PLR2004",
]
