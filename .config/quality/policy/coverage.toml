minimum_percent = 95.0
comparison = "strictly-above"
threshold_scopes = ["source-root"]
package_observation = "required"
metrics = ["statement", "branch"]
owner = "repository-quality"
source = "coverage.py exact statement and branch counts"
risk_model = "broad unobserved protocol or lifecycle control-flow or a wholly unexecuted semantic package can corrupt a replay service transition or release without an observable regression"
measurement = "independent exact statement and branch floors for each coverage.py source root plus non-zero execution evidence for every semantic package"
false_positive_cost = "source-root floors can still encourage low-risk tests while package and file ratios are too volatile to act as independent vetoes; branchless roots require statement evidence only"
remediation = "test meaningful behavior remove unreachable code or simplify the responsible semantic package; exclusions are not accepted"
review_condition = "reassess when escaped defects show the source-root and package-observation model misses a stable risk boundary or when three legitimate changes are blocked only by the source-root denominator"
