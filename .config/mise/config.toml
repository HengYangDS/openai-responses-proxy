min_version = "2026.9.11"

[settings]
idiomatic_version_file_enable_tools = []
locked = true
not_found_system_fallback = false
# Locked installs must not query Mise's optional version-index service.
use_versions_host = false

[tools]
# Language runtimes
node = "26.13.0"
python = "3.14.10"

# Dependency management
uv = "0.13.7"

# Specification and CI modeling
cue = "0.17.1"

# Structured data quality
"aqua:tamasfe/taplo" = "0.10.0"

# Static quality
"github:gitleaks/gitleaks" = "8.30.1"
"github:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"github:lycheeverse/lychee" = "lychee-v0.24.2"

[vars]
# The digest-pinned Renovate release that validates and inspects the dependency proposal policy.
renovate_image = "ghcr.io/renovatebot/renovate:44.222.5@sha256:8a4c49ef19bb71bedf4eaa4d1087a31a1793bd53de41478753d2d648e53eed19"

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
VIRTUAL_ENV = false
UV_PYTHON = false
UV_CONFIG_FILE = "{{config_root}}/.config/mise/uv.toml"
UV_NO_CONFIG = "false"
PYTHONHOME = false
PYTHONPATH = false
PYTHONNOUSERSITE = "1"

# Development tools must not inherit operator registries or shared npm configuration.
# npm treats environment names case-insensitively; remove its POSIX aliases.
npm_config_userconfig = false
npm_config_globalconfig = false
NPM_CONFIG_REGISTRY = false
npm_config_registry = false
NPM_CONFIG_USERCONFIG = "{{ config_root }}/.config/npm/npmrc"
NPM_CONFIG_GLOBALCONFIG = "{% if os() == 'windows' %}NUL{% else %}/dev/null{% endif %}"

[tasks.bootstrap]
description = "Install the locked Python and Node development dependencies"
run = [
  'uv sync --locked --all-groups --python "{{tools.python.path}}"',
  "npm ci --ignore-scripts",
  "npm audit signatures",
  "mise run workflow-supply",
]

[tasks.workflow-supply]
description = "Require the original workflow checker and both native integrations"
run = [
  "actionlint -version",
  "shellcheck --version",
  'uv run --locked --no-sync --python "{{tools.python.path}}" pyflakes --version',
]

[tasks.workflow-check]
description = "Check GitHub workflows with the complete original checker"
depends = ["workflow-supply"]
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" actionlint'

[tasks.quick]
description = "Run the editing feedback loop"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s quick'

[tasks.fix]
description = "Apply the repository formatters to every input that check verifies"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s fix'

[tasks.check]
description = "Run repository governance, quality, and Python compatibility gates"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s full'

[tasks.native]
description = "Verify the native artifact and real host service lifecycle"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release'

[tasks.release]
description = "Build and verify the native release asset without service registration"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release_asset'

[tasks."dependencies:check"]
description = "Validate the dependency proposal policy with the cached pinned Renovate image"
timeout = "2m"
run = """
docker run --pull=never --rm --read-only --network none --tmpfs /tmp:exec,mode=1777 \
  --mount "type=bind,source={{config_root}},target=/workspace,readonly" \
  --workdir /workspace --env HOME=/tmp \
  --entrypoint renovate-config-validator {{vars.renovate_image}} \
  --strict --no-global .config/checks/renovate/renovate.json5
"""

[tasks."dependencies:inspect"]
description = "Extract the dependency inventory offline with the cached pinned Renovate image"
timeout = "2m"
run = """
docker run --pull=never --rm --read-only --network none --tmpfs /tmp:exec,mode=1777 \
  --mount "type=bind,source={{config_root}},target=/workspace,readonly" \
  --workdir /workspace --env HOME=/tmp --env RENOVATE_BASE_DIR=/tmp/renovate \
  --env RENOVATE_CACHE_DIR=/tmp/renovate/cache \
  --env RENOVATE_ONBOARDING=false --env RENOVATE_REQUIRE_CONFIG=ignored \
  --env RENOVATE_GITHUB_TOKEN_WARN=false \
  --env LOG_LEVEL=debug --env LOG_FORMAT=json \
  --env RENOVATE_CONFIG_FILE=/workspace/.config/checks/renovate/renovate.json5 \
  --entrypoint renovate {{vars.renovate_image}} --platform=local --dry-run=extract
"""
