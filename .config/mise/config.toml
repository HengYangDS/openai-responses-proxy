min_version = "2026.9.11"

[settings]
idiomatic_version_file_enable_tools = []
locked = true
not_found_system_fallback = false
# Locked installs must not query Mise's optional version-index service.
use_versions_host = false

[vars]
# Official stable Linux supply preserves ShellCheck and Pyflakes on macOS.
actionlint_macos_image = "docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"

[tools]
# Language runtimes
node = "26.9.0"
python = "3.14.7"

# Dependency management
uv = "0.12.18"

# Specification and CI modeling
cue = "0.17.1"

# Structured data quality
"aqua:tamasfe/taplo" = "0.10.0"

# Static quality
"github:gitleaks/gitleaks" = "8.30.1"
"github:rhysd/actionlint" = "1.7.12"
"github:lycheeverse/lychee" = "lychee-v0.24.2"

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
VIRTUAL_ENV = false
UV_PYTHON = false
PYTHONHOME = false
PYTHONPATH = false
PYTHONNOUSERSITE = "1"

# Development tools must not inherit operator registries or shared npm configuration.
# npm treats environment names case-insensitively; remove its POSIX aliases.
npm_config_userconfig = false
npm_config_globalconfig = false
NPM_CONFIG_REGISTRY = false
npm_config_registry = false
NPM_CONFIG_USERCONFIG = "{{ config_root }}/.config/npm/npmrc"
NPM_CONFIG_GLOBALCONFIG = "{% if os() == 'windows' %}NUL{% else %}/dev/null{% endif %}"

[tasks.bootstrap]
description = "Install the locked Python and Node development dependencies"
run = [
  'uv sync --locked --all-groups --python "{{tools.python.path}}"',
  "npm ci --ignore-scripts",
  "npm audit signatures",
  "mise run workflow-supply",
]

[tasks.workflow-supply]
description = "Prepare the original workflow checker for this platform"
run = '{% if os() == "macos" %}docker pull {{vars.actionlint_macos_image}}{% else %}actionlint -version{% endif %}'

[tasks.workflow-check]
description = "Check GitHub workflows with the complete original checker"
run = '{% if os() == "macos" %}docker run --rm --pull=never --network=none --read-only --entrypoint /bin/busybox --mount type=bind,source="{{config_root}}",target=/repo,readonly --workdir /repo {{vars.actionlint_macos_image}} timeout -k 3 50 /usr/local/bin/actionlint{% else %}actionlint{% endif %}'

[tasks.quick]
description = "Run the editing feedback loop"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s quick'

[tasks.fix]
description = "Apply the repository formatters to every input that check verifies"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s fix'

[tasks.check]
description = "Run repository governance, quality, and Python compatibility gates"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s full'

[tasks.native]
description = "Verify the native artifact and real host service lifecycle"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release'

[tasks.release]
description = "Build and verify the native release asset without service registration"
run = 'uv run --locked --no-sync --python "{{tools.python.path}}" nox -s release_asset'
