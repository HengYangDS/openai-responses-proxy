source-and-governance:
  stage: verify
  image:
    name: ghcr.io/jdx/mise:2026.11.14-debian@sha256:a7df8beaeca2fc6d2e829278e5eef253330db5cde50bb196462616573107b120
    entrypoint:
      - ""
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    MISE_DATA_DIR: $CI_PROJECT_DIR/.cache/mise/data
    MISE_CACHE_DIR: $CI_PROJECT_DIR/.cache/mise/cache
    MISE_ENABLE_TOOLS: python,uv,node,npm,cue,aqua:tamasfe/taplo,github:gitleaks/gitleaks,github:rhysd/actionlint,aqua:koalaman/shellcheck,github:lycheeverse/lychee
    MISE_STATE_DIR: $CI_PROJECT_DIR/.cache/mise/state
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  cache:
    - key: uv-$OPENAI_RESPONSES_PROXY_CI_TARGET
      paths:
        - .cache/uv/
    - key:
        files:
          - .config/mise/mise.lock
        prefix: mise-quality-$OPENAI_RESPONSES_PROXY_CI_TARGET
      paths:
        - .cache/mise/data/
  before_script:
    - mise install --locked
    - mise exec --locked -- npm ci --ignore-scripts
    - mise exec --locked -- npm audit signatures
    - git fetch --tags --force --prune --prune-tags origin
    - mise exec --locked -- uv sync --locked --group quality --python python --no-python-downloads
  script:
    - mise exec --locked -- uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.governance
verify-python:
  stage: verify
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.12"
          - "3.13"
          - "3.14"
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client binutils
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv python install --no-bin $PYTHON_VERSION
  script:
    - python --version
    - uv run --locked --no-sync --python python --no-python-downloads nox -s "tests-$PYTHON_VERSION"
verify-python-quality:
  stage: verify
  image:
    name: $UV_PYTHON_FLOOR_IMAGE
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client binutils
    - git fetch --tags --force --prune --prune-tags origin
  script:
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv run --locked --no-sync --python python --no-python-downloads nox -s quality coverage
verify-performance:
  stage: verify
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
