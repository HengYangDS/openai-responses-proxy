    - apt-get install -qq -y --no-install-recommends curl ca-certificates libatomic1
    - git clone --filter=blob:none --no-checkout https://github.com/HengYangDS/ethos.git build/runtime/ethos-source
    - git -C build/runtime/ethos-source checkout --detach 92253d2a82560173f5c645cca419e5f302a11718
    - git -C build/runtime/ethos-source diff --exit-code ed29cbe27e0412ae82f4fe90dd18622cb69d62df HEAD --
    - uv --directory build/runtime/ethos-source sync --locked --no-install-project --group dev
    - uv --directory build/runtime/ethos-source run --locked --no-sync python -B -m tools.ci.toolchain.native --root . --mise node vale
    - uv --directory build/runtime/ethos-source run --locked --no-sync python -B -m tools.ci.toolchain.npm --seed ci --ignore-scripts
    - uv --directory build/runtime/ethos-source sync --locked --group dev --no-editable --no-build-isolation-package ethos
    - uv --directory build/runtime/ethos-source run --locked --no-sync python -B -I -m ethos.cli --version
    - uv --directory build/runtime/ethos-source run --locked --no-sync python -B -c 'import os; from pathlib import Path; from tools.ci.toolchain.environment import bind_commit_trust_material; bind_commit_trust_material(Path(os.environ["OPENAI_RESPONSES_PROXY_COMMIT_ROOT"]), os.environ["ETHOS_COMMIT_ALLOWED_SIGNERS"])'
  script:
    - build/runtime/ethos-source/.venv/bin/python -B -I -m ethos.cli hook commit-range --target-ref "$OPENAI_RESPONSES_PROXY_COMMIT_TARGET" --proposed-head "$OPENAI_RESPONSES_PROXY_COMMIT_HEAD" --remote-head "$OPENAI_RESPONSES_PROXY_COMMIT_BASE" --remote "$OPENAI_RESPONSES_PROXY_COMMIT_PEER" --trusted-baseline refs/remotes/origin/dev --root . --json
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        OPENAI_RESPONSES_PROXY_COMMIT_BASE: $CI_COMMIT_SHA
        OPENAI_RESPONSES_PROXY_COMMIT_TARGET: refs/tags/$CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      variables:
        OPENAI_RESPONSES_PROXY_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
        OPENAI_RESPONSES_PROXY_COMMIT_TARGET: refs/heads/$CI_COMMIT_REF_NAME
stages:
  - verify
  - release
variables:
  DEBIAN_FRONTEND: noninteractive
  OPENAI_RESPONSES_PROXY_RELEASE_TAG_REMOTE: origin
  UV_PYTHON_FLOOR_IMAGE: ghcr.io/astral-sh/uv:0.13.5-python3.12-trixie-slim@sha256:9b8477a5f2e2f96fa99eaecb7680c1c4c9f527926430f3b630bfb2c3641f8f20
  UV_PYTHON_LATEST_IMAGE: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim@sha256:d8e732839dfc4225a1ff698803b478b2223c05636c055d3add41ab9dbec0f315
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv/python
  OPENAI_RESPONSES_PROXY_CI_TARGET: linux-arm64
default:
  image:
    name: $UV_PYTHON_LATEST_IMAGE
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  cache:
    key: uv-$OPENAI_RESPONSES_PROXY_CI_TARGET
    paths:
      - .cache/uv/
verify-accepted-source:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
  script:
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.release.metadata
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.repository
verify-promotion:
  stage: verify
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - git fetch origin main dev --tags --force --prune --prune-tags
    - uv sync --locked --group quality --python python --no-python-downloads
  script:
    - git merge-base --is-ancestor origin/main "$CI_COMMIT_SHA"
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.release.metadata
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.repository
verify-release-tag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
    - test -f "${OPENAI_RESPONSES_PROXY_GITLAB_TAG_TRUST:-}"
  script:
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.release.metadata --tag "$CI_COMMIT_TAG"
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.release.tag_signature . "$CI_COMMIT_TAG" "$OPENAI_RESPONSES_PROXY_GITLAB_TAG_TRUST"
    - uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.repository
