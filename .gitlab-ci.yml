    OPENAI_RESPONSES_PROXY_COMMIT_HEAD: $CI_COMMIT_SHA
    OPENAI_RESPONSES_PROXY_COMMIT_PEER: gitlab
  cache:
    - key:
        files:
          - .config/mise/mise.lock
        prefix: mise-ethos-$OPENAI_RESPONSES_PROXY_CI_TARGET
      paths:
        - .cache/mise/data/
  before_script:
    - test "${ETHOS_COMMIT_ALLOWED_SIGNERS:-}" != "${ETHOS_COMMIT_ALLOWED_SIGNERS+${ETHOS_COMMIT_ALLOWED_SIGNERS%%[![:space:]]*}}"
    - mise install --locked
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git libatomic1 openssh-client
    - mise exec --locked -- ethos hook bind-trust --apply --root . --json
  script:
    - mise exec --locked -- ethos hook commit-range --target-ref "$OPENAI_RESPONSES_PROXY_COMMIT_TARGET" --proposed-head "$OPENAI_RESPONSES_PROXY_COMMIT_HEAD" --remote-head "$OPENAI_RESPONSES_PROXY_COMMIT_BASE" --remote "$OPENAI_RESPONSES_PROXY_COMMIT_PEER" --trusted-baseline refs/remotes/origin/dev --root . --json
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        OPENAI_RESPONSES_PROXY_COMMIT_BASE: $CI_COMMIT_SHA
        OPENAI_RESPONSES_PROXY_COMMIT_TARGET: refs/tags/$CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      variables:
        OPENAI_RESPONSES_PROXY_COMMIT_BASE: $CI_COMMIT_BEFORE_SHA
        OPENAI_RESPONSES_PROXY_COMMIT_TARGET: refs/heads/$CI_COMMIT_REF_NAME
stages:
  - verify
  - release
variables:
  DEBIAN_FRONTEND: noninteractive
  UV_PYTHON_FLOOR_IMAGE: ghcr.io/astral-sh/uv:0.13.8-python3.12-trixie-slim@sha256:ee8a8854267a3bd09ac0364420803fb74a069068b5fb279a2cf1df664f7273db
  UV_PYTHON_LATEST_IMAGE: ghcr.io/astral-sh/uv:0.13.8-python3.14-trixie-slim@sha256:81a1340fea1e72ad4a8e9a016128b0c61041cf182ea49fd788023e52842bc147
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv/python
  OPENAI_RESPONSES_PROXY_CI_TARGET: linux-arm64
default:
