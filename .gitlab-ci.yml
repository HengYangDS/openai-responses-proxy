    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
commit-admission:
  stage: verify
  timeout: 15m
  image:
    name: ghcr.io/jdx/mise:2026.11.14-debian@sha256:a7df8beaeca2fc6d2e829278e5eef253330db5cde50bb196462616573107b120
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
    MISE_DATA_DIR: $CI_PROJECT_DIR/.cache/mise/data
    MISE_CACHE_DIR: $CI_PROJECT_DIR/.cache/mise/cache
    MISE_ENABLE_TOOLS: github:HengYangDS/ethos
    MISE_STATE_DIR: $CI_PROJECT_DIR/.cache/mise/state
    OPENAI_RESPONSES_PROXY_COMMIT_HEAD: $CI_COMMIT_SHA
    OPENAI_RESPONSES_PROXY_COMMIT_PEER: gitlab
  cache:
    - key:
        files:
          - .config/mise/mise.lock
        prefix: mise-ethos-$OPENAI_RESPONSES_PROXY_CI_TARGET
      paths:
        - .cache/mise/data/
  before_script:
    - test "${ETHOS_COMMIT_ALLOWED_SIGNERS:-}" != "${ETHOS_COMMIT_ALLOWED_SIGNERS+${ETHOS_COMMIT_ALLOWED_SIGNERS%%[![:space:]]*}}"
    - mise install --locked
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git libatomic1 openssh-client
    - mise exec --locked -- ethos hook bind-trust --apply --root . --json
  script:
    - mise exec --locked -- ethos hook commit-range --target-ref "$OPENAI_RESPONSES_PROXY_COMMIT_TARGET" --proposed-head "$OPENAI_RESPONSES_PROXY_COMMIT_HEAD" --remote-head "$OPENAI_RESPONSES_PROXY_COMMIT_BASE" --remote "$OPENAI_RESPONSES_PROXY_COMMIT_PEER" --trusted-baseline refs/remotes/origin/dev --root . --json
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        OPENAI_RESPONSES_PROXY_COMMIT_BASE: $CI_MERGE_REQUEST_DIFF_BASE_SHA
        OPENAI_RESPONSES_PROXY_COMMIT_TARGET: refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
commit-admission-accepted:
  stage: verify
  timeout: 15m
  image:
