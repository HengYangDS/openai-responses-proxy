source-and-governance:
  stage: verify
  image:
    name: ghcr.io/jdx/mise@sha256:6bd2515bf27389f537921fc8c3e5a6579f15cf889a63a8432dc542670174e50a
    entrypoint:
      - ""
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    MISE_ENABLE_TOOLS: python,uv,node,cue,aqua:tamasfe/taplo,github:gitleaks/gitleaks,github:rhysd/actionlint,aqua:koalaman/shellcheck,github:lycheeverse/lychee
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - mise install --locked
    - npm ci --ignore-scripts
    - npm audit signatures
    - git fetch --tags --force --prune --prune-tags origin
    - mise exec --locked -- uv sync --locked --group quality --python python --no-python-downloads
  script:
    - mise exec --locked -- uv run --locked --no-sync --python python --no-python-downloads python -m tools.quality.governance --online-links
verify-python:
  stage: verify
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.12"
          - "3.13"
          - "3.14"
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - apt-get install -qq -y --no-install-recommends binutils
    - git fetch --tags --force --prune --prune-tags origin
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv python install --no-bin $PYTHON_VERSION
  script:
    - python --version
    - uv run --locked --no-sync --python python --no-python-downloads nox -s "tests-$PYTHON_VERSION"
verify-python-quality:
  stage: verify
  image:
    name: $UV_PYTHON_FLOOR_IMAGE
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
    UV_NO_CONFIG: "false"
  before_script:
    - uv tree --frozen --offline --universal --depth 0
    - uv --version
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends git openssh-client
    - apt-get install -qq -y --no-install-recommends binutils
    - git fetch --tags --force --prune --prune-tags origin
  script:
    - uv sync --locked --group quality --python python --no-python-downloads
    - uv run --locked --no-sync --python python --no-python-downloads nox -s quality
verify-performance:
  stage: verify
  tags:
    - $OPENAI_RESPONSES_PROXY_GITLAB_LINUX_REVIEW_RUNNER_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
  variables:
    GIT_DEPTH: "0"
    UV_CONFIG_FILE: .config/mise/uv.toml
