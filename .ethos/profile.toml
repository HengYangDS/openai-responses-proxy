profile_id = "openai-responses-proxy"

[openspec]
material_paths = ["**"]

[proof]
code_correctness_gates = ["python-quality", "python-matrix"]

[proof.code_correctness_map]
behavior = "python-matrix"
static-analysis = "python-quality"

[[proof.gates]]
id = "python-quality"
kind = "static"
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "--python",
  "python",
  "nox",
  "-s",
  "quality",
  "--report",
  "{native_output}/quality-nox.json",
]
verification_providers = ["ethos.adapters.gates.python_quality:static_report"]
dimensions = ["static-analysis", "types", "structure", "coverage"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
writes_files = true

[[proof.gates.native_outputs]]
path = "quality-nox.json"
format = "nox-json"
sessions = ["quality-3.12"]

[[proof.gates.native_outputs]]
path = "quality-ruff.json"
format = "ruff-json"
sessions = ["quality-3.12"]

[[proof.gates.native_outputs]]
path = "quality-ruff-runtime.json"
format = "python-runtime-json"
sessions = ["quality-3.12"]
python = "3.12"
configuration = ".config/checks/ruff/ruff.toml"
dependency_groups = ["quality"]

[[proof.gates]]
id = "python-matrix"
kind = "test"
command = [
  "mise",
  "exec",
  "--locked",
  "--",
  "uv",
  "run",
  "--locked",
  "--no-sync",
  "--python",
  "python",
  "nox",
  "-s",
  "tests",
  "--report",
  "{native_output}/matrix-nox.json",
]
verification_providers = ["ethos.adapters.gates.python_quality:behavior_report"]
dimensions = ["behavior", "test"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
writes_files = true

[[proof.gates.native_outputs]]
path = "matrix-nox.json"
format = "nox-json"
sessions = ["tests-3.12", "tests-3.13", "tests-3.14"]

[[proof.gates.native_outputs]]
path = "tests-3.12.xml"
format = "junit-xml"
sessions = ["tests-3.12"]

[[proof.gates.native_outputs]]
path = "tests-3.12-pytest.jsonl"
format = "pytest-jsonl"
sessions = ["tests-3.12"]

[[proof.gates.native_outputs]]
path = "tests-3.12-coverage.xml"
format = "coverage-xml"
sessions = ["tests-3.12"]

[[proof.gates.native_outputs]]
path = "tests-3.12-runtime.json"
format = "python-runtime-json"
sessions = ["tests-3.12"]
python = "3.12"
configuration = ".config/checks/pytest/pytest.toml"
dependency_groups = ["quality"]

[[proof.gates.native_outputs]]
