[publication]
local_verification_command = "uv run --locked --no-sync nox -s full"
local_installation_command = "uv run --locked --no-sync nox -s release"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "organization_collaboration"
git_remote = "gitlab"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".gitlab-ci.yml"

[[publication.peers]]
id = "github"
provider = "github"
role = "public_distribution"
git_remote = "github"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".github/workflows/verify.yml"

[protected_refs]
branches = ["main", "dev"]
tags = ["v*"]

[host_profile]
provider = "native-release"

[host_profile.surfaces]
verification = ".github/workflows/verify.yml"
installation = "README.md"

[attestation]
formats = ["spdx-2.3-json"]
signing = "ssh-signature"

[release]
mirror = "accepted_ff"
